name: Nike Adapt 2.0 BB CrazyBatto Android

on:
  push:
    branches:
      - feature/solelink-adapt-style-0.3.0
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  pull_request:
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solelink-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Entwicklungsschlüssel prüfen
        shell: bash
        run: test -s apps/SoleLinkDiagnostic/solelink-stable.jks

      - name: Einzelschuh-Verbindungslogik anwenden
        shell: bash
        run: python3 apps/SoleLinkDiagnostic/tools/apply_single_shoe_logic.py

      - name: Einzelschuh-Oberfläche anwenden
        shell: bash
        run: python3 apps/SoleLinkDiagnostic/tools/apply_single_shoe_ui.py

      - name: Einzelschuh-Build prüfen
        shell: bash
        run: |
          grep -F "EINZELSCHUH-MODUS" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ui/SingleShoeUi.kt
          grep -F "EIN SCHUH REICHT" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ui/SoleLinkApp.kt
          grep -F '"pairRequired", SingleShoePolicy.PAIR_REQUIRED' \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/util/JsonExport.kt

      - name: Unit-Tests ausführen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Installierbare APK bauen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon assembleDebug

      - name: APK benennen und prüfen
        shell: bash
        run: |
          APK_NAME="Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh.apk"
          cp apps/SoleLinkDiagnostic/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          test -s "$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -F "application-label:'Nike Adapt 2.0 BB'" apk-badging.txt
          grep -F "versionName='0.4.3'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$APK_NAME"
          sha256sum "$APK_NAME" > \
            Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh-SHA256.txt

      - name: Vollständigen Projekt-ZIP erzeugen
        shell: bash
        run: |
          cd apps
          zip -qr ../Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh-source.zip \
            SoleLinkDiagnostic \
            -x "SoleLinkDiagnostic/.gradle/*" \
            -x "SoleLinkDiagnostic/app/build/*" \
            -x "SoleLinkDiagnostic/solelink-stable.jks"

      - name: APK und Projekt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh
          path: |
            Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh.apk
            Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh-SHA256.txt
            Nike-Adapt-2.0-BB-CrazyBatto-0.4.3-Einzelschuh-source.zip
          if-no-files-found: error
          retention-days: 90
