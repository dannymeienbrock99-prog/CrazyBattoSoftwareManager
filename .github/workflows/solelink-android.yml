name: SoleLink Android

on:
  push:
    branches:
      - feature/adapt-local-diagnostic
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  pull_request:
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solelink-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests ausführen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug-APK bauen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon assembleDebug

      - name: Vollständigen Projekt-ZIP erzeugen
        shell: bash
        run: |
          cd apps
          zip -qr ../SoleLinkDiagnostic-complete.zip SoleLinkDiagnostic \
            -x "SoleLinkDiagnostic/.gradle/*" \
            -x "SoleLinkDiagnostic/app/build/*"

      - name: APK und Projekt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SoleLink-Diagnostic-build
          path: |
            apps/SoleLinkDiagnostic/app/build/outputs/apk/debug/app-debug.apk
            SoleLinkDiagnostic-complete.zip
          if-no-files-found: error
