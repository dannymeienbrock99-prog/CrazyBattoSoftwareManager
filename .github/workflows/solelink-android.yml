name: Nike Adapt BB 2.0 CrazyBatto Android

on:
  push:
    branches:
      - feature/solelink-adapt-style-0.3.0
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
      - ".github/patches/solelink-identify-0.5.0.part*"
  pull_request:
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
      - ".github/patches/solelink-identify-0.5.0.part*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solelink-identify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Sichere Identify-Testquellen 0.5.0 einspielen
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/solelink-identify-0.5.0.part* \
            > /tmp/solelink-identify-0.5.0.tar.gz
          echo "9301dac9a9618bb7bbf7c898a138b85f955362b1516b4999fdf23a0ca53f89f3  /tmp/solelink-identify-0.5.0.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/solelink-identify-0.5.0.tar.gz -C .

      - name: Entwicklungsschlüssel prüfen
        shell: bash
        run: test -s apps/SoleLinkDiagnostic/solelink-stable.jks

      - name: Funktions- und Sicherheitsumfang prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -F "SICHERER SCHUH-LICHTTEST" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ui/SoleLinkApp.kt
          grep -F "identifyTransportPacket" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ble/BigfootProtocol.kt
          grep -F "80 14 00 00" apps/SoleLinkDiagnostic/README.md
          grep -F "versionCode = 9" apps/SoleLinkDiagnostic/app/build.gradle.kts
          grep -F 'versionName = "0.5.0"' apps/SoleLinkDiagnostic/app/build.gradle.kts
          grep -F "super.onCreate(null)" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/MainActivity.kt
          grep -F "!hasAll(context)" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/BluetoothPermissions.kt
          if grep -R -E "fun[[:space:]]+(tighten|loosen|setPosition|setServo|writeFirmware)" \
              apps/SoleLinkDiagnostic/app/src/main/java; then
            echo "Unerlaubte Motor- oder Firmware-Funktion gefunden."
            exit 1
          fi

      - name: Unit-Tests ausführen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Installierbare APK bauen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon assembleDebug

      - name: APK benennen und statisch prüfen
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test.apk"
          cp apps/SoleLinkDiagnostic/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          test -s "$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -F "application-label:'Nike Adapt BB 2.0'" apk-badging.txt
          grep -F "versionName='0.5.0'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$APK_NAME"
          sha256sum "$APK_NAME" > \
            Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test-SHA256.txt

      - name: Vollständigen Projekt-ZIP erzeugen
        shell: bash
        run: |
          cd apps
          zip -qr ../Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test-source.zip \
            SoleLinkDiagnostic \
            -x "SoleLinkDiagnostic/.gradle/*" \
            -x "SoleLinkDiagnostic/app/build/*" \
            -x "SoleLinkDiagnostic/solelink-stable.jks"

      - name: APK und Projekt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test
          path: |
            Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test.apk
            Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test-SHA256.txt
            Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test-source.zip
          if-no-files-found: error
          retention-days: 90

      - name: Frische Installation ohne Bluetooth-Berechtigung starten
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            PACKAGE="de.crazybatto.solelink.control.stable"
            ACTIVITY="de.crazybatto.solelink.MainActivity"
            APK="Nike-Adapt-BB-2.0-CrazyBatto-0.5.0-Identify-Test.apk"

            adb install -r "$APK"
            adb shell pm revoke "$PACKAGE" android.permission.BLUETOOTH_SCAN || true
            adb shell pm revoke "$PACKAGE" android.permission.BLUETOOTH_CONNECT || true
            adb shell am force-stop "$PACKAGE"
            adb logcat -c
            adb shell am start -W -n "$PACKAGE/$ACTIVITY" | tee runtime-activity-start.txt
            sleep 8

            adb shell pidof "$PACKAGE" | tee runtime-pid.txt
            test -s runtime-pid.txt
            adb exec-out screencap -p > runtime-start.png
            adb shell uiautomator dump /sdcard/runtime-window.xml
            adb pull /sdcard/runtime-window.xml runtime-window.xml
            adb logcat -d > runtime-logcat.txt

            if grep -E "FATAL EXCEPTION|Unable to start activity|Process: $PACKAGE" runtime-logcat.txt; then
              echo "App ist beim Start abgestürzt."
              exit 1
            fi

      - name: Laufzeit-Diagnose immer hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nike-Adapt-BB-2.0-0.5.0-runtime-test
          path: |
            runtime-activity-start.txt
            runtime-pid.txt
            runtime-start.png
            runtime-window.xml
            runtime-logcat.txt
          if-no-files-found: ignore
          retention-days: 14
