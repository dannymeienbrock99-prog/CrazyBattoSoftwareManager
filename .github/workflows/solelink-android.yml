name: SoleLink Control Android

on:
  push:
    branches:
      - feature/solelink-adapt-style-0.3.0
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  pull_request:
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solelink-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Quellcode für aktuelle Compose-Version bereinigen
        shell: bash
        run: |
          sed -i '/import androidx.compose.foundation.layout.weight/d' \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ui/SoleLinkApp.kt

      - name: Unit-Tests ausführen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Installierbare APK bauen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon assembleDebug

      - name: APK benennen und prüfen
        shell: bash
        run: |
          cp apps/SoleLinkDiagnostic/app/build/outputs/apk/debug/app-debug.apk \
            SoleLink-Control-0.3.0.apk
          test -s SoleLink-Control-0.3.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            SoleLink-Control-0.3.0.apk | head -n 8
          sha256sum SoleLink-Control-0.3.0.apk > SoleLink-Control-0.3.0-SHA256.txt

      - name: Vollständigen Projekt-ZIP erzeugen
        shell: bash
        run: |
          cd apps
          zip -qr ../SoleLink-Control-0.3.0-source.zip SoleLinkDiagnostic \
            -x "SoleLinkDiagnostic/.gradle/*" \
            -x "SoleLinkDiagnostic/app/build/*"

      - name: APK und Projekt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SoleLink-Control-0.3.0
          path: |
            SoleLink-Control-0.3.0.apk
            SoleLink-Control-0.3.0-SHA256.txt
            SoleLink-Control-0.3.0-source.zip
          if-no-files-found: error
          retention-days: 90
