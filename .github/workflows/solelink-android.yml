name: Nike Adapt 2.0 BB CrazyBatto Android

on:
  push:
    branches:
      - feature/solelink-adapt-style-0.3.0
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  pull_request:
    paths:
      - "apps/SoleLinkDiagnostic/**"
      - ".github/workflows/solelink-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solelink-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Entwicklungsschlüssel prüfen
        shell: bash
        run: test -s apps/SoleLinkDiagnostic/solelink-stable.jks

      - name: Einzelschuh-Verbindungslogik anwenden
        shell: bash
        run: python3 apps/SoleLinkDiagnostic/tools/apply_single_shoe_logic.py

      - name: Einzelschuh-Oberfläche anwenden
        shell: bash
        run: python3 apps/SoleLinkDiagnostic/tools/apply_single_shoe_ui.py

      - name: Einzelschuh- und Startfix prüfen
        shell: bash
        run: |
          grep -F "EINZELSCHUH-MODUS" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ui/SingleShoeUi.kt
          grep -F "EIN SCHUH REICHT" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/ui/SoleLinkApp.kt
          grep -F '"pairRequired", SingleShoePolicy.PAIR_REQUIRED' \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/util/JsonExport.kt
          grep -F "super.onCreate(null)" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/MainActivity.kt
          grep -F "!hasAll(context)" \
            apps/SoleLinkDiagnostic/app/src/main/java/de/crazybatto/solelink/BluetoothPermissions.kt

      - name: Unit-Tests ausführen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Installierbare APK bauen
        working-directory: apps/SoleLinkDiagnostic
        run: ./gradlew --no-daemon assembleDebug

      - name: APK benennen und statisch prüfen
        shell: bash
        run: |
          APK_NAME="Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix.apk"
          cp apps/SoleLinkDiagnostic/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          test -s "$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -F "application-label:'Nike Adapt 2.0 BB'" apk-badging.txt
          grep -F "versionName='0.4.4'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$APK_NAME"
          sha256sum "$APK_NAME" > \
            Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix-SHA256.txt

      - name: Frische Installation ohne Bluetooth-Berechtigung starten
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            PACKAGE="de.crazybatto.solelink.control.stable"
            ACTIVITY="de.crazybatto.solelink.MainActivity"
            APK="Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix.apk"

            adb install -r "$APK"
            adb shell pm revoke "$PACKAGE" android.permission.BLUETOOTH_SCAN || true
            adb shell pm revoke "$PACKAGE" android.permission.BLUETOOTH_CONNECT || true
            adb shell am force-stop "$PACKAGE"
            adb logcat -c
            adb shell input keyevent 82 || true
            adb shell am start -W -n "$PACKAGE/$ACTIVITY" | tee runtime-activity-start.txt
            sleep 8

            adb shell pidof "$PACKAGE" | tee runtime-pid.txt
            test -s runtime-pid.txt
            adb exec-out screencap -p > runtime-start.png
            adb shell uiautomator dump /sdcard/runtime-window.xml
            adb pull /sdcard/runtime-window.xml runtime-window.xml
            adb logcat -d > runtime-logcat.txt

            if grep -E "FATAL EXCEPTION|Unable to start activity|Process: $PACKAGE" runtime-logcat.txt; then
              echo "App ist beim Start abgestürzt."
              exit 1
            fi

            grep -E "Nike Adapt BB 2.0|EINZELSCHUH-MODUS|EIN SCHUH REICHT|Bluetooth-Zugriff erforderlich" \
              runtime-window.xml

      - name: Laufzeit-Diagnose immer hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nike-Adapt-BB-2.0-0.4.4-runtime-test
          path: |
            runtime-activity-start.txt
            runtime-pid.txt
            runtime-start.png
            runtime-window.xml
            runtime-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Vollständigen Projekt-ZIP erzeugen
        shell: bash
        run: |
          cd apps
          zip -qr ../Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix-source.zip \
            SoleLinkDiagnostic \
            -x "SoleLinkDiagnostic/.gradle/*" \
            -x "SoleLinkDiagnostic/app/build/*" \
            -x "SoleLinkDiagnostic/solelink-stable.jks"

      - name: APK und Projekt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix
          path: |
            Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix.apk
            Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix-SHA256.txt
            Nike-Adapt-BB-2.0-CrazyBatto-0.4.4-StartFix-source.zip
          if-no-files-found: error
          retention-days: 90
