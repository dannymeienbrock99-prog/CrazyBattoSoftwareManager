name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 36 installieren
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Gradle Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.13

      - name: Testen und Debug-APK bauen
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SoleLink-Diagnostic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
